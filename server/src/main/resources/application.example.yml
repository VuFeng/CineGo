spring:
  application:
    name: cinego-server

  datasource:
    url: jdbc:postgresql://localhost:5432/cinego_db
    username: your-database-username
    password: your-database-password
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        prepareThreshold: 0 # Tắt prepared statements để tương thích với Supabase pooler

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          use_server_prepared_statement: false # Tắt prepared statements để tương thích với Supabase pooler
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: false # Supabase pooler yêu cầu autocommit enabled
          # Lưu ý: Với autocommit enabled, transaction rollback sẽ không hoạt động
          # Nên dùng noRollbackFor cho các exceptions không cần rollback

  flyway:
    enabled: false # Tắt tạm thời vì chưa có migrations và có vấn đề với Supabase pooler
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Ho_Chi_Minh

  web:
    resources:
      add-mappings: false # Disable static resource handling để tránh conflict với REST endpoints

server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    root: INFO
    com.cinego.server: INFO
    org.springframework.web: WARN # Chỉ log warnings và errors, không log resolved exceptions
    org.springframework.web.servlet.DispatcherServlet: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  jwt:
    secret: ${JWT_SECRET:your-secret-key-change-in-production-min-256-bits}
    expiration: 86400000 # 24 hours in milliseconds
    refresh-expiration: 604800000 # 7 days in milliseconds

  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS
    allowed-headers: "*"
    allow-credentials: true
